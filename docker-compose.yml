services:
  # ============================================================
  # MQTT BROKER
  # ============================================================
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # ============================================================
  # INFLUXDB
  # ============================================================
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: utp
      DOCKER_INFLUXDB_INIT_BUCKET: sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mySuperSecretToken123!
    restart: unless-stopped

  # ============================================================
  # TIME SERVER (FASE 1 - Cristian Mejorado)
  # ============================================================
  time-server:
    build: .
    container_name: time-server
    depends_on:
      - mqtt-broker
    command: "node time-server/time-server.js"
    restart: on-failure

  # ============================================================
  # FASE 0: 5 PUBLISHERS
  # ============================================================

  publisher-1:
    build: .
    container_name: publisher-1
    depends_on:
      - mqtt-broker
      - time-server
    command: "node publisher/publisher.js"
    environment:
      DEVICE_ID: sensor-1
      CLOCK_DRIFT_RATE: 100
      PROCESS_PRIORITY: 10
      ELECTION_PARTICIPANTS: sensor-1:10,sensor-2:20,sensor-3:30,sensor-4:40,sensor-5:50
    restart: on-failure

  publisher-2:
    build: .
    container_name: publisher-2
    depends_on:
      - mqtt-broker
      - time-server
    command: "node publisher/publisher.js"
    environment:
      DEVICE_ID: sensor-2
      CLOCK_DRIFT_RATE: -200
      PROCESS_PRIORITY: 20
      ELECTION_PARTICIPANTS: sensor-1:10,sensor-2:20,sensor-3:30,sensor-4:40,sensor-5:50
    restart: on-failure

  publisher-3:
    build: .
    container_name: publisher-3
    depends_on:
      - mqtt-broker
      - time-server
    command: "node publisher/publisher.js"
    environment:
      DEVICE_ID: sensor-3
      CLOCK_DRIFT_RATE: 300
      PROCESS_PRIORITY: 30
      ELECTION_PARTICIPANTS: sensor-1:10,sensor-2:20,sensor-3:30,sensor-4:40,sensor-5:50
    restart: on-failure

  publisher-4:
    build: .
    container_name: publisher-4
    depends_on:
      - mqtt-broker
      - time-server
    command: "node publisher/publisher.js"
    environment:
      DEVICE_ID: sensor-4
      CLOCK_DRIFT_RATE: -400
      PROCESS_PRIORITY: 40
      ELECTION_PARTICIPANTS: sensor-1:10,sensor-2:20,sensor-3:30,sensor-4:40,sensor-5:50
    restart: on-failure

  publisher-5:
    build: .
    container_name: publisher-5
    depends_on:
      - mqtt-broker
      - time-server
    command: "node publisher/publisher.js"
    environment:
      DEVICE_ID: sensor-5
      CLOCK_DRIFT_RATE: 50
      PROCESS_PRIORITY: 50
      ELECTION_PARTICIPANTS: sensor-1:10,sensor-2:20,sensor-3:30,sensor-4:40,sensor-5:50
    restart: on-failure

  # ============================================================
  # SUBSCRIPTOR PRINCIPAL (Persistencia + Validación Temporal)
  # ============================================================
  persistence-subscriber:
    build: .
    container_name: persistence-subscriber
    depends_on:
      - mqtt-broker
      - influxdb
    command: "node subscriber/persistence-subscriber.js"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: mySuperSecretToken123!
      INFLUXDB_ORG: utp
      INFLUXDB_BUCKET: sensors
    restart: on-failure

  # ============================================================
  # SUBSCRIPTORES SIMPLES
  # ============================================================
  unicast-subscriber:
    build: .
    container_name: unicast-subscriber
    depends_on:
      - mqtt-broker
    command: "node subscriber/unicast.js"
    restart: on-failure

  multicast-subscriber:
    build: .
    container_name: multicast-subscriber
    depends_on:
      - mqtt-broker
    command: "node subscriber/multicast.js"
    restart: on-failure

  broadcast-subscriber:
    build: .
    container_name: broadcast-subscriber
    depends_on:
      - mqtt-broker
    command: "node subscriber/broadcast.js"
    restart: on-failure

  monitor:
    build: .
    container_name: monitor
    depends_on:
      - mqtt-broker
    command: "node subscriber/monitor.js"
    restart: on-failure

  # ============================================================
  # WEB MONITOR
  # ============================================================
  web-monitor:
    image: nginx:1.25-alpine
    container_name: web-monitor
    ports:
      - "8080:80"
    volumes:
      - ./web-monitor:/usr/share/nginx/html:ro
    depends_on:
      - mqtt-broker
    restart: unless-stopped

# ============================================================
# VOLUMENES
# ============================================================
volumes:
  influxdb_data:
